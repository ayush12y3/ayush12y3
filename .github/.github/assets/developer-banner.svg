<svg width="1200" height="380" viewBox="0 0 1200 380"
xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- Background -->
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#03070b"/>
    <stop offset="50%" stop-color="#0a1118"/>
    <stop offset="100%" stop-color="#101b24"/>
  </linearGradient>

  <!-- Green -->
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00ff9c"/>
    <stop offset="100%" stop-color="#00c978"/>
  </linearGradient>

  <!-- Blue -->
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00d9ff"/>
    <stop offset="100%" stop-color="#1479ff"/>
  </linearGradient>

  <!-- Glow -->
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- Grid -->
  <pattern id="grid" width="40" height="40"
           patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40"
          fill="none"
          stroke="#1b2935"
          stroke-width="1"/>
  </pattern>

</defs>


